[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ae-sentinel"
version = "1.0.0"
description = "药物临床试验不良事件智能监测平台 (AE Sentinel)"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.22.0",
    "chromadb>=0.4.0",
    "PyJWT>=2.8.0",
    "python-docx>=0.8.11",
    "python-multipart>=0.0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["*.py"]
